<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uifino — The Frontend Design Library Your AI Agent Builds With</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      color-scheme: dark;
      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "Geist Mono", "SFMono-Regular", Menlo, monospace;
      --font-pixel: "Silkscreen", "Geist Mono", monospace;
      --font-editorial: "Cormorant Garamond", Georgia, serif;

      --color-background: #0a0a0c;
      --color-background-100: #111114;
      --color-background-200: #16161a;
      --color-foreground: #ececee;
      --color-border: #222227;
      --color-accent: #ceff00;
      --color-accent-light: rgba(206, 255, 0, 0.14);
      --color-accent-foreground: #0a0a0c;

      --color-contrast: #ffffff;
      --color-contrast-foreground: #000000;

      --color-gray-100: #18181c;
      --color-gray-200: #202026;
      --color-gray-300: #2b2b33;
      --color-gray-400: #383842;
      --color-gray-600: #7a7a85;
      --color-gray-700: #9a9aa5;
      --color-gray-800: #b4b4be;
      --color-gray-900: #d0d0d8;
      --color-gray-1000: #f4f4f6;

      --color-gray-alpha-100: rgba(255, 255, 255, 0.04);
      --color-gray-alpha-200: rgba(255, 255, 255, 0.075);

      --hero-heading: #f4f4f6;
      --color-panel: #141418;
      --color-panel-border: #2b2b33;
      --color-code-bg: #0e0e11;
      --card-mini-bg: #0e0e11;
      --card-mini-bg2: #131317;
      --card-mini-border: rgba(255, 255, 255, 0.11);
      --card-fade: #0a0a0c;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --color-background: #f7f6f2;
      --color-background-100: #fffefb;
      --color-background-200: #f2f0ea;
      --color-foreground: #1b1a17;
      --color-border: #e2dfd7;
      --color-accent: #a01a6d;
      --color-accent-light: rgba(160, 26, 109, 0.12);
      --color-accent-foreground: #ffffff;

      --color-contrast: #1b1a17;
      --color-contrast-foreground: #ffffff;

      --color-gray-100: #efede8;
      --color-gray-200: #e7e4de;
      --color-gray-300: #dcd9d2;
      --color-gray-400: #cfcbc3;
      --color-gray-600: #726e67;
      --color-gray-700: #64605a;
      --color-gray-800: #514e48;
      --color-gray-900: #44413c;
      --color-gray-1000: #1b1a17;

      --color-gray-alpha-100: rgba(0, 0, 0, 0.04);
      --color-gray-alpha-200: rgba(0, 0, 0, 0.075);

      --hero-heading: #1b1a17;
      --color-panel: #fffefb;
      --color-panel-border: #dcd9d2;
      --color-code-bg: #f0eee9;
      --card-mini-bg: #ffffff;
      --card-mini-bg2: #f7f6f2;
      --card-mini-border: rgba(0, 0, 0, 0.11);
      --card-fade: #f7f6f2;
    }

    * { box-sizing: border-box; border-color: var(--color-border); }
    html { scroll-behavior: smooth; background: var(--color-background); color: var(--color-foreground); font-family: var(--font-sans); }
    body { margin: 0; background: var(--color-background); color: var(--color-foreground); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    .font-pixel { font-family: var(--font-pixel); }
    .font-mono-ui { font-family: var(--font-mono); }
    .font-editorial { font-family: var(--font-editorial); }

    .hero-stripes {
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 5px,
        var(--color-gray-alpha-100) 5px,
        var(--color-gray-alpha-100) 6px
      );
    }

    .top-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 0 11px;
      border-radius: 5px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--color-gray-700);
      transition: color 140ms ease, background-color 140ms ease;
      cursor: pointer;
    }
    .top-nav-btn:hover { color: var(--color-gray-1000); background: var(--color-gray-alpha-100); }
    .top-nav-btn.is-active { color: var(--color-gray-1000); background: var(--color-gray-200); }

    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
      color: var(--color-gray-700);
      border-left: 2px solid transparent;
      transition: all 120ms ease;
      text-align: left;
      cursor: pointer;
    }
    .tree-item:hover { color: var(--color-gray-1000); background: var(--color-gray-alpha-100); }
    .tree-item.is-active {
      color: var(--color-gray-1000);
      background: var(--color-gray-100);
      border-left-color: var(--color-accent);
      font-weight: 500;
    }

    .seg-pill {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-gray-700);
      transition: all 130ms ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg-pill:hover { color: var(--color-gray-1000); }
    .seg-pill.is-active {
      background: var(--color-gray-200);
      color: var(--color-gray-1000);
      box-shadow: inset 0 0 0 1px var(--color-border);
    }

    /* Crosshair registration marks */
    .crosshair-plus { position: absolute; width: 11px; height: 11px; pointer-events: none; z-index: 20; }
    .crosshair-plus::before, .crosshair-plus::after { content: ""; position: absolute; background: var(--color-gray-600); }
    .crosshair-plus::before { left: 5px; top: 0; width: 1px; height: 11px; }
    .crosshair-plus::after { top: 5px; left: 0; width: 11px; height: 1px; }

    /* Zero-gap bento cell + 3-card fan deck */
    .bento-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 196px;
      padding: 18px 18px 0 18px;
      overflow: hidden;
      text-align: left;
      background: var(--color-background);
      transition: background-color 180ms ease;
      cursor: pointer;
    }
    .bento-cell:hover { background: var(--color-background-100); }

    .fan-deck { position: relative; height: 114px; width: 100%; margin-top: 12px; }
    .fan-card {
      position: absolute;
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--card-mini-border);
      border-bottom: 0;
      background: var(--card-mini-bg);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 200ms ease;
    }
    .fan-card-back1 { left: -18px; bottom: -8px; width: 120px; height: 82px; transform: rotate(-8deg); opacity: 0.45; background: var(--card-mini-bg2); }
    .fan-card-back2 { left: 16px; bottom: -4px; width: 145px; height: 94px; transform: rotate(-3.5deg); opacity: 0.72; background: var(--card-mini-bg2); }
    .fan-card-front { right: -6px; left: 56px; bottom: 0; height: 106px; padding: 12px 12px 0 12px; z-index: 3; background: var(--card-mini-bg); }
    .bento-cell:hover .fan-card-back1 { transform: rotate(-11deg) translate(-3px, -2px); opacity: 0.6; }
    .bento-cell:hover .fan-card-back2 { transform: rotate(-5deg) translate(-2px, -4px); opacity: 0.88; }
    .bento-cell:hover .fan-card-front { transform: translateY(-4px); border-color: color-mix(in srgb, var(--color-accent) 45%, var(--card-mini-border)); }

    .cell-fade-bottom {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26px; pointer-events: none; z-index: 6;
      background: linear-gradient(to top, var(--card-fade) 10%, transparent 100%);
    }

    .inset-frame {
      position: relative; margin-left: 42px; margin-right: -18px; height: 108px;
      border-top-left-radius: 12px; border-top: 1px solid var(--card-mini-border); border-left: 1px solid var(--card-mini-border);
      background: var(--card-mini-bg); padding: 14px 16px 10px 16px; display: flex; align-items: center; justify-content: center;
      transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 200ms ease;
    }
    .bento-cell:hover .inset-frame { transform: translate(-3px, -3px); border-color: color-mix(in srgb, var(--color-accent) 45%, var(--card-mini-border)); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeUp 240ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }

    html[data-theme="dark"] .icon-sun { display: block; }
    html[data-theme="dark"] .icon-moon { display: none; }
    html[data-theme="light"] .icon-sun { display: none; }
    html[data-theme="light"] .icon-moon { display: block; }
  </style>
</head>
<body class="antialiased">

  <!-- TOP ANNOUNCEMENT BAR -->
  <div id="announcement-bar" class="relative border-b" style="background:var(--color-background-100);border-color:var(--color-border)">
    <div class="mx-auto flex max-w-6xl items-center justify-center gap-2.5 px-10 py-2 text-[13px]">
      <span class="rounded px-1.5 py-0.5 font-mono-ui text-[10px] font-bold uppercase" style="color:var(--color-accent);border:1px solid color-mix(in srgb, var(--color-accent) 45%, transparent)">MCP</span>
      <span class="font-medium" style="color:var(--color-gray-1000)">Add uifino to your AI agent.</span>
      <span class="hidden md:inline" style="color:var(--color-gray-700)">Search web &amp; app catalogs, blocks, pages &amp; motion from a prompt.</span>
      <button type="button" data-go="mcp:overview" class="font-mono-ui text-[12px] font-semibold hover:underline" style="color:var(--color-accent)">Connect →</button>
    </div>
    <button id="dismiss-banner-btn" type="button" aria-label="Dismiss" class="absolute right-2.5 top-1/2 -translate-y-1/2 grid size-6 place-items-center rounded hover:bg-[var(--color-gray-200)]" style="color:var(--color-gray-600)">✕</button>
  </div>

  <!-- STICKY TOP NAVBAR (Click top items -> Level 1 Category Index!) -->
  <header class="sticky top-0 z-50 border-b backdrop-blur-md" style="border-color:var(--color-border);background:color-mix(in srgb, var(--color-background) 92%, transparent)">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
      <div class="flex items-center gap-5">
        <button type="button" data-go="home" class="font-pixel inline-flex items-center text-[16px] tracking-[0.08em]" style="color:var(--color-gray-1000)">
          ui<span style="color:var(--color-accent)">fino</span>
        </button>

        <nav class="hidden md:flex items-center gap-1">
          <button type="button" data-go="blocks-index" data-top-tab="blocks" class="top-nav-btn">Blocks</button>
          <button type="button" data-go="catalog-index" data-top-tab="catalog" class="top-nav-btn">Catalog</button>
          <button type="button" data-go="tools:bg/acid-mesh" data-top-tab="tools" class="top-nav-btn">Tools</button>
          <button type="button" data-go="mcp:overview" data-top-tab="mcp" class="top-nav-btn">
            MCP <span class="rounded px-1 py-0.5 font-mono-ui text-[9.5px] font-bold uppercase" style="background:var(--color-accent-light);color:var(--color-accent)">AI</span>
          </button>
        </nav>
      </div>

      <!-- Right Cluster: ⌘K + GitHub + Language + Sign in + Theme -->
      <div class="flex items-center gap-2 sm:gap-2.5">
        <button id="cmdk-open-btn" type="button" class="hidden h-8 items-center gap-2 rounded-md border px-2.5 text-[12.5px] hover:bg-[var(--color-gray-100)] sm:inline-flex" style="border-color:var(--color-border);background:var(--color-background-100);color:var(--color-gray-600)">
          <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
          <span>Search…</span>
          <kbd class="ml-3 rounded border px-1 py-0.5 font-mono-ui text-[10px]" style="border-color:var(--color-border);background:var(--color-background)">⌘K</kbd>
        </button>

        <button id="github-star-btn" type="button" class="hidden sm:flex items-stretch overflow-hidden rounded-[4px] hover:opacity-90" style="border:1px solid var(--color-border)">
          <span class="flex items-center px-2 py-1.5" style="background:var(--color-gray-100);color:var(--color-gray-900)">
            <svg fill="currentColor" height="13" viewBox="0 0 16 16" width="13"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
          </span>
          <span class="flex items-center gap-1 px-2 py-1.5 font-mono-ui text-[11.5px]" style="background:var(--color-background);color:var(--color-gray-900);border-left:1px solid var(--color-border)">
            <span style="color:#F5A623">★</span><span id="gh-star-count">12.4k</span>
          </span>
        </button>

        <div class="relative">
          <button id="lang-menu-btn" type="button" aria-label="Language" class="inline-flex h-8 items-center gap-1 rounded-md border px-2 font-mono-ui text-[12px] hover:bg-[var(--color-gray-100)]" style="border-color:var(--color-border);background:var(--color-background-100);color:var(--color-gray-900)">
            <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="lang-code-label">EN</span>
          </button>
          <div id="lang-dropdown" class="absolute right-0 mt-1.5 hidden w-36 overflow-hidden rounded-md border py-1 shadow-xl z-50" style="background:var(--color-panel);border-color:var(--color-panel-border)">
            <button type="button" data-lang="EN" data-lang-name="English" class="flex w-full items-center justify-between px-3 py-1.5 text-left text-[12.5px] hover:bg-[var(--color-gray-200)]"><span>English</span><span class="font-mono-ui text-[10px]" style="color:var(--color-accent)">EN</span></button>
            <button type="button" data-lang="ZH" data-lang-name="简体中文" class="flex w-full items-center justify-between px-3 py-1.5 text-left text-[12.5px] hover:bg-[var(--color-gray-200)]"><span>简体中文</span><span class="font-mono-ui text-[10px]" style="color:var(--color-gray-600)">ZH</span></button>
            <button type="button" data-lang="JA" data-lang-name="日本語" class="flex w-full items-center justify-between px-3 py-1.5 text-left text-[12.5px] hover:bg-[var(--color-gray-200)]"><span>日本語</span><span class="font-mono-ui text-[10px]" style="color:var(--color-gray-600)">JA</span></button>
          </div>
        </div>

        <button type="button" data-toast="Sign in — sync bookmarks &amp; MCP keys" class="inline-flex h-8 items-center rounded-md border px-3 text-[13px] font-medium hover:bg-[var(--color-gray-100)]" style="border-color:var(--color-border);background:var(--color-background-100);color:var(--color-gray-1000)">Sign in</button>

        <button id="theme-toggle-btn" type="button" aria-label="Toggle theme" class="inline-flex size-8 items-center justify-center rounded-md border hover:bg-[var(--color-gray-100)]" style="border-color:var(--color-border);background:var(--color-background-100);color:var(--color-gray-900)">
          <svg class="icon-sun size-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon size-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP VIEWPORT -->
  <div id="app-root" class="min-h-[78vh]"></div>

  <!-- FOOTER -->
  <footer class="border-t py-10" style="border-color:var(--color-border);background:var(--color-background)">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 sm:px-6 text-[12.5px]" style="color:var(--color-gray-600)">
      <span class="font-pixel text-[14px]" style="color:var(--color-gray-1000)">ui<span style="color:var(--color-accent)">fino</span></span>
      <div class="flex flex-wrap gap-5">
        <button type="button" data-go="blocks-index" class="hover:text-[var(--color-gray-1000)]">Blocks Index</button>
        <button type="button" data-go="blocks-cat:hero" class="hover:text-[var(--color-gray-1000)]">/hero-block</button>
        <button type="button" data-go="blocks-detail:hero/hero-animated-counter" class="hover:text-[var(--color-gray-1000)]">/blocks/hero-animated-counter</button>
        <button type="button" data-go="catalog-index" class="hover:text-[var(--color-gray-1000)]">Catalog</button>
        <button type="button" data-go="mcp:overview" class="hover:text-[var(--color-gray-1000)]">MCP</button>
      </div>
    </div>
  </footer>

  <!-- GLOBAL ⌘K MODAL -->
  <div id="cmdk-modal" class="fixed inset-0 z-50 hidden items-start justify-center pt-20 p-4">
    <div id="cmdk-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-[2px]"></div>
    <div class="relative z-10 w-full max-w-lg overflow-hidden rounded-lg border shadow-2xl animate-fade-up" style="background:var(--color-panel);border-color:var(--color-panel-border)">
      <div class="flex items-center gap-2 border-b px-3.5 py-2.5" style="border-color:var(--color-border)">
        <input id="cmdk-input" type="text" placeholder="Jump to /blocks, /hero-block, /blocks/hero-animated-counter, catalog, MCP…" class="w-full bg-transparent text-[13.5px] outline-none" style="color:var(--color-gray-1000)" />
        <button id="cmdk-close" type="button" class="font-mono-ui text-[11px] px-1.5 py-0.5 rounded border" style="border-color:var(--color-border);color:var(--color-gray-600)">ESC</button>
      </div>
      <div id="cmdk-results" class="max-h-80 overflow-y-auto p-2 space-y-1"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast-container" class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2"></div>

  <script>
    (function () {
      // ==========================================
      // 1. COMPLETE 3-LEVEL BLOCKS DATA
      // Level 1: Categories -> Level 2: Category Gallery -> Level 3: Tree + Interactive Detail
      // ==========================================
      const BLOCK_CATS = [
        {
          id: "hero", name: "Hero", group: "Marketing", count: 150, desc: "High-converting hero sections with animated counters, split rails, terminal CLIs, and editorial headlines.",
          back2: `<div class="p-2 text-[7.5px] leading-tight" style="color:var(--color-gray-700)"><div class="font-semibold text-[8.5px]" style="color:var(--color-gray-900)">Plan the day.<br/>Keep the streak.</div></div>`,
          front: `<div class="text-center pt-1"><div class="inline-block rounded-full border px-1.5 py-0.5 text-[6px]" style="border-color:var(--card-mini-border);color:var(--color-gray-600)">uifino v0.5</div><div class="mt-1.5 text-[11px] font-semibold leading-[1.15]" style="color:var(--color-gray-1000)">Interfaces that<br/>ship in minutes</div><div class="mt-1.5 mx-auto h-1 w-24 rounded-full opacity-30" style="background:var(--color-gray-600)"></div></div>`,
          items: [
            { id: "hero-animated-counter", name: "Hero — Animated Counter", kind: "Animated", tags: ["animated", "counter", "stats", "hero"], desc: "Bold centered hero paired with a live animated 4-column metric counter strip that counts up smoothly on load." },
            { id: "hero-split-architectural", name: "Hero — Split Architectural", kind: "Split", tags: ["split", "stripes", "saas"], desc: "Two-column micro-striped hero with value proposition left and live interactive proof stage right." },
            { id: "hero-terminal-cli", name: "Hero — Terminal CLI", kind: "Terminal", tags: ["cli", "devtools", "mono"], desc: "Developer-first hero anchored by an interactive copyable npx command bar and live terminal output." },
            { id: "hero-editorial-serif", name: "Hero — Editorial Serif", kind: "Editorial", tags: ["serif", "warm", "minimal"], desc: "Literary slab-serif display headline with restrained negative tracking and generous whitespace." }
          ]
        },
        {

      function toast(msg) {
        const c = document.getElementById("toast-container");
        c.innerHTML = "";
        const el = document.createElement("div");
        el.className = "pointer-events-auto flex items-center gap-2 rounded-md border px-3.5 py-2 text-[12.5px] font-medium shadow-xl animate-fade-up";
        el.style.background = "var(--color-panel)"; el.style.borderColor = "var(--color-panel-border)"; el.style.color = "var(--color-gray-1000)";
        el.innerHTML = '<span class="size-2 rounded-full" style="background:var(--color-accent)"></span><span>' + msg + '</span>';
        c.appendChild(el);
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.remove(), 2200);
      }

      function copyText(text, msg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => toast(msg || "Copied")).catch(() => fallbackCopy(text, msg));
        } else { fallbackCopy(text, msg); }
      }
      function fallbackCopy(text, msg) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast(msg || "Copied"); } catch (e) {}
        ta.remove();
      }

      function go(target) {
        const colon = target.indexOf(":");
        if (colon === -1) { state.view = target; state.param = ""; }
        else { state.view = target.slice(0, colon); state.param = target.slice(colon + 1); }
        state.catKind = "All";
        const topKey = state.view.startsWith("blocks") ? "blocks" : (state.view.startsWith("catalog") ? "catalog" : (state.view === "tools" ? "tools" : (state.view === "mcp" ? "mcp" : "")));
        document.querySelectorAll("[data-top-tab]").forEach(b => b.classList.toggle("is-active", b.getAttribute("data-top-tab") === topKey));
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

        const b = WEBSITES.find(w => w.id === state.detailSkin) || WEBSITES[0];

        return { ...p, serif: b.serif };

              <span class="crosshair-plus" style="right:-6px;bottom:-6px"></span>

      // ==========================================

      // ==========================================
      // LEVEL 3: /blocks/hero-animated-counter (LEFT TREE + RIGHT CONTENT WORKSPACE!)
      // ==========================================
      function renderBlockDetailWorkspace(param) {
        const [catId, itemId] = param.split("/");
        const cat = BLOCK_CATS.find(c => c.id === catId) || BLOCK_CATS[0];
        const item = cat.items.find(i => i.id === itemId) || cat.items[0];
        const maxW = state.detailVp === "mobile" ? "390px" : (state.detailVp === "tablet" ? "768px" : "100%");
        const cli = `npx uifino@latest add ${item.id}`;
        const codeStr = `<section class="py-16 text-center">\n  <h1>Build production UI at 10x speed</h1>\n  <div class="grid grid-cols-4 divide-x border rounded-lg">\n    <!-- Animated Counter Cells: 550+, 180+, 99.9%, 14ms -->\n  </div>\n</section>`;
        const mdStr = `---\nname: ${item.id}\ncategory: ${cat.name}\ntags: [${item.tags.join(", ")}]\n---\n## Layout & Motion Contract\n- Tabular numerals (\`font-variant-numeric: tabular-nums\`) prevent width jitter during count-up.\n- 4-column divided strip collapses to 2×2 grid below 640px.\n- Honor \`prefers-reduced-motion: reduce\` by rendering final numbers immediately.`;

        return `
        <div class="mx-auto max-w-7xl lg:grid lg:grid-cols-[248px_minmax(0,1fr)] lg:items-start border-x animate-fade-up" style="border-color:var(--color-border)">

            ${BLOCK_CATS.map(c => `
              <div>
                <button type="button" data-go="blocks-cat:${c.id}" class="mb-1 px-2.5 flex w-full items-center justify-between font-mono-ui text-[10.5px] uppercase tracking-[0.1em] hover:text-[var(--color-gray-1000)]" style="color:${c.id === cat.id ? 'var(--color-accent)' : 'var(--color-gray-600)'}">
                  <span>${c.name}</span><span>${c.count}</span>
                </button>
                <div class="space-y-0.5">
                  ${c.items.map(it => {
                    const act = it.id === item.id;
                    return `<button type="button" data-go="blocks-detail:${c.id}/${it.id}" class="tree-item ${act ? 'is-active' : ''}"><span class="truncate">${it.name.replace(c.name + " — ", "")}</span></button>`;
                  }).join("")}
                </div>
              </div>`).join("")}
          </aside>

          <!-- RIGHT INTERACTIVE WORKSPACE -->
          <div class="min-w-0 px-4 py-7 sm:px-8 lg:px-10 space-y-6">
            <!-- Breadcrumb -->
            <div class="flex flex-wrap items-center justify-between gap-2 font-mono-ui text-[12px]" style="color:var(--color-gray-600)">
              <div>
                <button type="button" data-go="home" class="hover:text-[var(--color-gray-1000)]">Home</button> /
                <button type="button" data-go="blocks-index" class="hover:text-[var(--color-gray-1000)]">Blocks</button> /
                <button type="button" data-go="blocks-cat:${cat.id}" class="hover:text-[var(--color-gray-1000)]">${cat.name}</button> /
                <span style="color:var(--color-gray-1000)">${item.id}</span>
              </div>
              <div class="flex gap-1.5">${item.tags.map(t => `<span class="px-1.5 py-0.5 rounded border text-[10.5px]" style="border-color:var(--color-border)">#${t}</span>`).join("")}</div>
            </div>

            <!-- Header + CLI Install Pill -->
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <h1 class="m-0 text-[26px] sm:text-[32px] font-bold tracking-[-0.025em]">${item.name}</h1>
                <p class="mt-1.5 max-w-2xl text-[14.5px] m-0" style="color:var(--color-gray-700)">${item.desc}</p>
              </div>
              <div class="flex items-center gap-2 rounded-md border px-3 py-2 font-mono-ui text-[12px]" style="background:var(--color-code-bg);border-color:var(--color-border)">
                <span style="color:var(--color-accent)">${cli}</span>
                <button type="button" data-copy="${cli}" class="rounded border px-2 py-0.5 text-[10.5px] hover:bg-[var(--color-gray-200)]" style="border-color:var(--color-border)">Copy</button>
              </div>
            </div>

            <!-- Interactive Viewer Toolbar (Preview | Code | DESIGN.md + Viewport + Skin + Replay) -->
            <div class="flex flex-wrap items-center justify-between gap-3 rounded-lg border p-2.5" style="border-color:var(--color-border);background:var(--color-background-100)">
              <div class="inline-flex rounded-md border p-0.5" style="border-color:var(--color-border);background:var(--color-background)">
                <button type="button" data-dtab="preview" class="seg-pill ${state.detailTab === 'preview' ? 'is-active' : ''}">Preview</button>
                <button type="button" data-dtab="code" class="seg-pill ${state.detailTab === 'code' ? 'is-active' : ''}">Code</button>
                <button type="button" data-dtab="design-md" class="seg-pill ${state.detailTab === 'design-md' ? 'is-active' : ''}">DESIGN.md</button>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <!-- Brand Skin Switcher -->
                <div class="inline-flex items-center gap-1">
                  ${['default', 'claude', 'linear', 'vercel', 'stripe'].map(sk => `<button type="button" data-dskin="${sk}" class="h-7 rounded border px-2 font-mono-ui text-[11px] capitalize" style="${state.detailSkin === sk ? 'border-color:var(--color-accent);color:var(--color-accent);background:var(--color-background)' : 'border-color:var(--color-border);color:var(--color-gray-700)'}">${sk}</button>`).join("")}
                </div>
                <!-- Viewport Switcher -->
                <div class="inline-flex rounded-md border p-0.5" style="border-color:var(--color-border);background:var(--color-background)">

              </div>` : `
              <div class="rounded-lg border overflow-hidden" style="border-color:var(--color-border);background:var(--color-code-bg)">
                <div class="flex justify-between items-center border-b px-4 py-2 font-mono-ui text-[11.5px]" style="border-color:var(--color-border);color:var(--color-gray-600)"><span>DESIGN.md</span><button type="button" data-copy="${mdStr.replace(/"/g,'&quot;')}" class="underline">Copy DESIGN.md</button></div>
                <pre class="m-0 p-5 overflow-x-auto font-mono-ui text-[12.5px] leading-relaxed" style="color:var(--color-gray-900)">${mdStr}</pre>
              </div>`)}
          </div>
        </div>`;
      }

      // CATALOG INDEX + DETAIL

        return `
        <div class="mx-auto max-w-6xl border-x animate-fade-up" style="border-color:var(--color-border)">
          <div class="hero-stripes border-b px-6 py-10 sm:px-10" style="border-color:var(--color-border)">

          </div>
          <div class="p-6 sm:p-8 space-y-8">

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">

              </div>

      function renderTools() {
        const css = `background-color:${state.bgC2};background-image:radial-gradient(${state.bgSc}px circle at 50% 35%, rgba(206,255,0,${(state.bgOp/100).toFixed(2)}), transparent 72%);`;
        return `
        <div class="mx-auto max-w-6xl border-x p-6 sm:p-10 space-y-6 animate-fade-up" style="border-color:var(--color-border)">
          <div><div class="font-mono-ui text-[11px] uppercase" style="color:var(--color-accent)">Tools / Background Generator</div><h1 class="mt-1 text-[28px] font-bold m-0">Custom Background Studio</h1></div>
          <div class="grid grid-cols-1 gap-6 lg:grid-cols-[1.25fr_0.75fr]">
            <div class="space-y-4">
              <div class="flex h-72 items-center justify-center rounded-lg border" style="${css};border-color:var(--color-panel-border)"><span class="rounded border px-3 py-1.5 font-mono-ui text-[12px] bg-black/50 text-white">Live Preview</span></div>
              <pre class="m-0 overflow-x-auto rounded-lg border p-4 font-mono-ui text-[12px]" style="background:var(--color-code-bg);border-color:var(--color-border)">.uifino-bg { ${css} }</pre>
            </div>
            <div class="rounded-lg border p-5 space-y-4 h-fit" style="border-color:var(--color-border);background:var(--color-background-100)">
              <label class="block text-[12px]"><div class="flex justify-between mb-1"><span>Opacity</span><span>${state.bgOp}%</span></div><input id="bg-op" type="range" min="4" max="60" value="${state.bgOp}" class="w-full accent-[var(--color-accent)]"/></label>
              <label class="block text-[12px]"><div class="flex justify-between mb-1"><span>Glow Radius</span><span>${state.bgSc}px</span></div><input id="bg-sc" type="range" min="160" max="600" step="10" value="${state.bgSc}" class="w-full accent-[var(--color-accent)]"/></label>
              <button type="button" data-copy="${css}" class="h-9 w-full rounded-md text-[12.5px] font-semibold" style="background:var(--color-accent);color:var(--color-accent-foreground)">Copy CSS</button>
            </div>
          </div>
        </div>`;
      }

      function renderMcp() {
        const terms = state.mcpQuery.toLowerCase().split(/[\s,]+/).filter(Boolean);
        const mw = WEBSITES.filter(w => !terms.length || terms.some(t => w.tags.includes(t) || w.name.toLowerCase().includes(t)));
        const cfg = `{\n  "mcpServers": {\n    "uifino": { "url": "https://mcp.uifino.dev/sse" }\n  }\n}`;
        return `
        <div class="mx-auto max-w-6xl border-x p-6 sm:p-10 space-y-6 animate-fade-up" style="border-color:var(--color-border)">
          <div><div class="font-mono-ui text-[11px] uppercase" style="color:var(--color-accent)">AI Integration / MCP Server</div><h1 class="mt-1 text-[28px] font-bold m-0">Connect AI Agents to uifino</h1></div>
          <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div class="rounded-lg border p-5" style="border-color:var(--color-border);background:var(--color-background-100)"><div class="flex justify-between mb-2"><span class="font-mono-ui text-[11px] uppercase" style="color:var(--color-accent)">mcp.json</span><button type="button" data-copy='${cfg}' class="font-mono-ui text-[11px] underline">Copy</button></div><pre class="m-0 rounded border p-4 font-mono-ui text-[12px]" style="background:var(--color-code-bg);border-color:var(--color-border)">${cfg}</pre></div>
            <div class="rounded-lg border p-5" style="border-color:var(--color-border);background:var(--color-background-100)"><div class="font-mono-ui text-[11px] uppercase mb-2" style="color:var(--color-accent)">Live AI Tag Simulator</div><input id="mcp-tag-input" type="text" value="${state.mcpQuery}" class="h-9 w-full rounded border px-3 font-mono-ui text-[12.5px] outline-none focus:border-[var(--color-accent)]" style="border-color:var(--color-border);background:var(--color-background);color:var(--color-gray-1000)"/><div class="mt-3 flex flex-wrap gap-1.5">${mw.map(w => `<button type="button" data-go="catalog-detail:web/${w.id}" class="rounded border px-2.5 py-1 text-[12px] hover:border-[var(--color-accent)]" style="border-color:var(--color-border)">Web: ${w.name}</button>`).join("")}</div></div>
          </div>
        </div>`;
      }

      // Animate counters in Level 3 Hero Counter
      function runCounterAnimation() {
        document.querySelectorAll(".anim-counter").forEach(el => {
          const target = parseFloat(el.getAttribute("data-target"));
          const isFloat = String(el.getAttribute("data-target")).includes(".");
          const start = performance.now();
          const dur = 850;
          function tick(now) {
            const prog = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - prog, 3);
            const cur = target * eased;
            el.textContent = isFloat ? cur.toFixed(1) : Math.round(cur);
            if (prog < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        });
      }

      function render() {
        const root = document.getElementById("app-root");
        if (state.view === "home") root.innerHTML = renderHome();
        else if (state.view === "blocks-index") root.innerHTML = renderBlocksIndex();
        else if (state.view === "blocks-cat") root.innerHTML = renderBlocksCategory(state.param);
        else if (state.view === "blocks-detail") root.innerHTML = renderBlockDetailWorkspace(state.param);
        else if (state.view === "catalog-index") root.innerHTML = renderCatalogIndex();
        else if (state.view === "catalog-detail") root.innerHTML = renderCatalogDetail(state.param);
        else if (state.view === "tools") root.innerHTML = renderTools();
        else if (state.view === "mcp") root.innerHTML = renderMcp();

        // Bind dynamic inputs
        const idxSearch = document.getElementById("idx-search");
        if (idxSearch) idxSearch.addEventListener("input", e => { state.idxSearch = e.target.value; render(); const el = document.getElementById("idx-search"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
        const replay = document.getElementById("replay-counter-btn");
        if (replay) replay.addEventListener("click", runCounterAnimation);
        if (state.view === "blocks-detail" && state.param.includes("hero-animated-counter") && state.detailTab === "preview") runCounterAnimation();
        const bop = document.getElementById("bg-op"), bsc = document.getElementById("bg-sc");
        if (bop) bop.addEventListener("input", e => { state.bgOp = Number(e.target.value); render(); });
        if (bsc) bsc.addEventListener("input", e => { state.bgSc = Number(e.target.value); render(); });
        const mcpIn = document.getElementById("mcp-tag-input");
        if (mcpIn) mcpIn.addEventListener("input", e => { state.mcpQuery = e.target.value; render(); const el = document.getElementById("mcp-tag-input"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      }

      // ⌘K Palette
      const CMDK_LIST = [
        { label: "Level 1: All Block Categories (/blocks)", go: "blocks-index" },
        { label: "Level 2: Hero Gallery (/hero-block)", go: "blocks-cat:hero" },
        { label: "Level 3: Hero — Animated Counter (/blocks/hero-animated-counter)", go: "blocks-detail:hero/hero-animated-counter" },
        { label: "Level 3: Hero — Terminal CLI", go: "blocks-detail:hero/hero-terminal-cli" },
        { label: "Catalog: Website & App Systems", go: "catalog-index" },
        { label: "Tools: Background Generator", go: "tools:bg/acid-mesh" },
        { label: "AI Integration: MCP Server", go: "mcp:overview" }
      ];
      function renderCmdk(q) {
        const list = CMDK_LIST.filter(x => !q || x.label.toLowerCase().includes(q.toLowerCase()));
        document.getElementById("cmdk-results").innerHTML = list.map(x => `<button type="button" data-go="${x.go}" class="block w-full rounded px-3 py-2 text-left text-[13px] hover:bg-[var(--color-gray-200)]">${x.label}</button>`).join("");
      }
      function openCmdk() { const m = document.getElementById("cmdk-modal"); m.classList.remove("hidden"); m.classList.add("flex"); const i = document.getElementById("cmdk-input"); i.value = ""; renderCmdk(""); setTimeout(() => i.focus(), 30); }
      function closeCmdk() { const m = document.getElementById("cmdk-modal"); m.classList.add("hidden"); m.classList.remove("flex"); }

      document.getElementById("dismiss-banner-btn").addEventListener("click", () => { document.getElementById("announcement-bar").style.display = "none"; });
      document.getElementById("theme-toggle-btn").addEventListener("click", () => { state.appTheme = state.appTheme === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", state.appTheme); });
      document.getElementById("github-star-btn").addEventListener("click", () => { state.starred = !state.starred; state.starCount += state.starred ? 1 : -1; document.getElementById("gh-star-count").textContent = (state.starCount / 1000).toFixed(1) + "k"; toast(state.starred ? "Starred uifino" : "Unstarred"); });
      document.getElementById("lang-menu-btn").addEventListener("click", e => { e.stopPropagation(); document.getElementById("lang-dropdown").classList.toggle("hidden"); });
      document.getElementById("cmdk-open-btn").addEventListener("click", openCmdk);
      document.getElementById("cmdk-close").addEventListener("click", closeCmdk);
      document.getElementById("cmdk-backdrop").addEventListener("click", closeCmdk);
      document.getElementById("cmdk-input").addEventListener("input", e => renderCmdk(e.target.value));
      document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); } if (e.key === "Escape") closeCmdk(); });

      document.body.addEventListener("click", e => {
        if (!e.target.closest("#lang-menu-btn") && !e.target.closest("#lang-dropdown")) document.getElementById("lang-dropdown").classList.add("hidden");
        const lang = e.target.closest("[data-lang]");
        if (lang) { document.getElementById("lang-code-label").textContent = lang.getAttribute("data-lang"); document.getElementById("lang-dropdown").classList.add("hidden"); toast("Language: " + lang.getAttribute("data-lang-name")); return; }
        const goEl = e.target.closest("[data-go]");
        if (goEl) { closeCmdk(); go(goEl.getAttribute("data-go")); return; }
        const ig = e.target.closest("[data-idx-group]");
        if (ig) { state.idxGroup = ig.getAttribute("data-idx-group"); render(); return; }
        const ck = e.target.closest("[data-cat-kind]");
        if (ck) { state.catKind = ck.getAttribute("data-cat-kind"); render(); return; }
        const dt = e.target.closest("[data-dtab]");
        if (dt) { state.detailTab = dt.getAttribute("data-dtab"); render(); return; }
        const dv = e.target.closest("[data-dvp]");
        if (dv) { state.detailVp = dv.getAttribute("data-dvp"); render(); return; }
        const ds = e.target.closest("[data-dskin]");
        if (ds) { state.detailSkin = ds.getAttribute("data-dskin"); render(); return; }
        const dm = e.target.closest("[data-dmode-toggle]");
        if (dm) { state.detailMode = state.detailMode === "dark" ? "light" : "dark"; render(); return; }
        const ash = e.target.closest("[data-apply-skin-to-hero]");
        if (ash) { state.detailSkin = ash.getAttribute("data-apply-skin-to-hero"); go("blocks-detail:hero/hero-animated-counter"); return; }
        const cp = e.target.closest("[data-copy]");
        if (cp) { copyText(cp.getAttribute("data-copy"), "Copied to clipboard"); return; }
        const tt = e.target.closest("[data-toast]");
        if (tt) { toast(tt.getAttribute("data-toast")); }
      });

      // INIT
      render();
    })();
  </script>
</body>
</html>
